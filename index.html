<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقع السحب</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:0 auto;padding:24px;text-align:center}
button{font-size:18px;padding:12px 24px;margin:8px;border:0;border-radius:8px;background:#1a73e8;color:#fff}
#admin{display:none;margin-top:24px;border-top:1px solid #ccc;padding-top:16px}
</style>
</head>
<body>
<h1>🎁 السحب</h1>
<p id="msg">سجّل دخولك للاشتراك</p>
<button id="login">الدخول بجوجل</button>
<button id="join" style="display:none">اشترك في السحب</button>
<button id="out" style="display:none;background:#777">خروج</button>
<h2 id="winner"></h2>
<div id="admin">
<button id="draw">اسحب فائزًا</button>
<p id="count"></p>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,collection,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyATHhHkoy7w6x8ht4NqxPysX3q8WC7DmiE",
  authDomain:"sahbaha-f7f8b.firebaseapp.com",
  projectId:"sahbaha-f7f8b",
  storageBucket:"sahbaha-f7f8b.firebasestorage.app",
  messagingSenderId:"434766319310",
  appId:"1:434766319310:web:30f2d72869325be34fca9f"
});
const auth=getAuth(app), db=getFirestore(app);
const ADMIN="mahran@gmail.com";
const $=id=>document.getElementById(id);

onSnapshot(doc(db,"draws","latest"),s=>{
  $("winner").textContent=s.exists()?"🏆 الفائز: "+s.data().name:"";
});

onAuthStateChanged(auth,async u=>{
  $("login").style.display=u?"none":"";
  $("join").style.display=u?"":"none";
  $("out").style.display=u?"":"none";
  $("admin").style.display=(u&&u.email===ADMIN)?"block":"none";
  if(!u){$("msg").textContent="سجّل دخولك للاشتراك";return;}
  $("msg").textContent="أهلًا "+u.displayName;
  const e=await getDoc(doc(db,"entries",u.uid));
  if(e.exists()){$("msg").textContent="✅ أنت مشترك في السحب";$("join").style.display="none";}
});

$("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
$("out").onclick=()=>signOut(auth);

$("join").onclick=async()=>{
  const u=auth.currentUser;
  await setDoc(doc(db,"entries",u.uid),{name:u.displayName,email:u.email,at:serverTimestamp()});
  $("msg").textContent="✅ تم اشتراكك";
  $("join").style.display="none";
};

$("draw").onclick=async()=>{
  const s=await getDocs(collection(db,"entries"));
  $("count").textContent="عدد المشتركين: "+s.size;
  if(!s.size)return alert("لا يوجد مشتركين");
  const i=crypto.getRandomValues(new Uint32Array(1))[0]%s.size;
  await setDoc(doc(db,"draws","latest"),{name:s.docs[i].data().name,at:serverTimestamp()});
};
</script>
</body>
</html>
