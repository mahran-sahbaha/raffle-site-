<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سحوبات وجوائز</title>
<style>
:root{--bg:#f4f1ff;--ink:#1d1b3a;--main:#6c3df4;--main2:#ff5fa2;--mute:#6b6888}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:28px 20px 44px;text-align:center}
header h1{margin:0 0 6px;font-size:28px}
header p{margin:0;opacity:.9}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
.bar span{font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:var(--main);color:#fff;font-weight:600}
button.light{background:#fff;color:var(--main)}
button.gray{background:#e5e2f5;color:var(--ink)}
button.red{background:#e5484d}
button:disabled{opacity:.5;cursor:default}
main{max-width:900px;margin:-24px auto 40px;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(60,40,140,.12);display:flex;flex-direction:column}
.pic{height:160px;background:#ece8ff;display:flex;align-items:center;justify-content:center;font-size:64px}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0}
.body p{margin:0;color:var(--mute);font-size:14px}
.tag{font-size:13px;color:var(--mute)}
.code{background:#f0ebff;border-radius:10px;padding:10px;text-align:center}
.code b{display:block;font-size:26px;letter-spacing:3px;color:var(--main)}
.win{background:#fff6d6;border-radius:10px;padding:10px;text-align:center}
.admin{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(60,40,140,.12)}
.admin h3{margin-top:0}
.admin input,.admin textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #d6d1ee;border-radius:8px;font:inherit}
.row{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>🎁 سحوبات وجوائز</h1>
  <p>اختار الجايزة واشترك في السحب وخد رقمك</p>
  <div class="bar">
    <button id="login" class="light">الدخول بجوجل</button>
    <span id="who"></span>
    <button id="out" class="light" style="display:none">خروج</button>
  </div>
</header>
<main>
  <div id="admin" class="admin" style="display:none">
    <h3>لوحة الإدارة: إضافة جايزة جديدة</h3>
    <input id="a_title" placeholder="اسم الجايزة">
    <textarea id="a_desc" rows="2" placeholder="وصف الجايزة"></textarea>
    <input id="a_img" placeholder="رابط صورة (اختياري، يبدأ بـ https)">
    <input id="a_date" placeholder="موعد السحب (مثلًا: 15 نوفمبر)">
    <button id="add">إضافة الجايزة</button>
  </div>
  <div id="list" class="grid"></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,addDoc,updateDoc,deleteDoc,collection,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyATHhHkoy7w6x8ht4NqxPysX3q8WC7DmiE",
  authDomain:"sahbaha-f7f8b.firebaseapp.com",
  projectId:"sahbaha-f7f8b",
  storageBucket:"sahbaha-f7f8b.firebasestorage.app",
  messagingSenderId:"434766319310",
  appId:"1:434766319310:web:30f2d72869325be34fca9f"
});
const auth=getAuth(app), db=getFirestore(app);
const ADMIN="mahranasyed@gmail.com";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0];

let user=null, raffles=[], codes={};
const isAdmin=()=>!!(user&&user.email&&user.email.toLowerCase()===ADMIN);

async function loadCodes(){
  if(!user){codes={};return;}
  await Promise.all(raffles.map(async r=>{
    if(codes[r.id])return;
    try{
      const e=await getDoc(doc(db,"raffles",r.id,"entries",user.uid));
      if(e.exists())codes[r.id]=e.data().code;
    }catch(err){}
  }));
}

function render(){
  $("admin").style.display=isAdmin()?"block":"none";
  const box=$("list");
  if(!raffles.length){
    box.innerHTML='<div class="empty">لا توجد جوائز حاليًا، ارجع قريبًا 🎈</div>';
    return;
  }
  box.innerHTML=raffles.map(r=>{
    const open=r.status==="open";
    const img=/^https:\/\//.test(r.image||"")?'<img src="'+esc(r.image)+'" alt="">':"🎁";
    let act="";
    if(!open){
      const me=codes[r.id]&&codes[r.id]===r.winnerCode;
      act='<div class="win">'+(me?"🎉 مبروك، أنت الفائز!<br>":"")+'🏆 الفائز: <b>'+esc(r.winnerName)+'</b><br>رقمه: '+esc(r.winnerCode)+'</div>';
    }else if(codes[r.id]){
      act='<div class="code">✅ أنت مشترك، رقمك<b>'+esc(codes[r.id])+'</b></div>';
    }else{
      act='<button data-join="'+r.id+'">اشترك في السحب</button>';
    }
    let adm="";
    if(isAdmin()){
      adm='<div class="row">'+(open?'<button class="gray" data-draw="'+r.id+'">اسحب فائزًا</button>':"")+'<button class="red" data-del="'+r.id+'">حذف</button></div>';
    }
    return '<div class="card"><div class="pic">'+img+'</div><div class="body"><h3>'+esc(r.title)+'</h3><p>'+esc(r.desc)+'</p><div class="tag">📅 موعد السحب: '+esc(r.date||"قريبًا")+'</div>'+act+adm+'</div></div>';
  }).join("");
}

onSnapshot(query(collection(db,"raffles"),orderBy("createdAt","desc")),async s=>{
  raffles=s.docs.map(d=>({id:d.id,...d.data()}));
  await loadCodes();
  render();
});

onAuthStateChanged(auth,async u=>{
  user=u; codes={};
  $("login").style.display=u?"none":"";
  $("out").style.display=u?"":"none";
  $("who").textContent=u?("أهلًا "+(u.displayName||"")):"";
  await loadCodes();
  render();
});

$("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>alert("تعذر تسجيل الدخول"));
$("out").onclick=()=>signOut(auth);

async function join(id,b){
  if(!user){alert("سجّل دخولك بجوجل الأول");return;}
  b.disabled=true;
  try{
    const code=String(100000+rnd()%900000);
    await setDoc(doc(db,"raffles",id,"entries",user.uid),{name:user.displayName||"مشترك",email:user.email,code,at:serverTimestamp()});
    codes[id]=code; render();
  }catch(err){
    alert("تعذر الاشتراك، جرّب تاني");
    b.disabled=false;
  }
}

async function draw(id){
  try{
    const s=await getDocs(collection(db,"raffles",id,"entries"));
    if(!s.size){alert("لا يوجد مشتركين");return;}
    if(!confirm("عدد المشتركين: "+s.size+". تأكيد السحب؟"))return;
    const w=s.docs[rnd()%s.size].data();
    await updateDoc(doc(db,"raffles",id),{status:"closed",winnerName:w.name,winnerCode:w.code});
  }catch(err){alert("حصل خطأ في السحب");}
}

async function del(id){
  if(!confirm("حذف الجايزة نهائيًا؟"))return;
  try{await deleteDoc(doc(db,"raffles",id));}catch(err){alert("تعذر الحذف");}
}

$("list").onclick=e=>{
  const b=e.target.closest("button");
  if(!b)return;
  if(b.dataset.join)join(b.dataset.join,b);
  else if(b.dataset.draw)draw(b.dataset.draw);
  else if(b.dataset.del)del(b.dataset.del);
};

$("add").onclick=async()=>{
  const title=$("a_title").value.trim();
  if(!title){alert("اكتب اسم الجايزة");return;}
  try{
    await addDoc(collection(db,"raffles"),{
      title,
      desc:$("a_desc").value.trim(),
      image:$("a_img").value.trim(),
      date:$("a_date").value.trim(),
      status:"open",
      createdAt:serverTimestamp()
    });
    ["a_title","a_desc","a_img","a_date"].forEach(i=>$(i).value="");
  }catch(err){alert("تعذرت الإضافة، اتأكد إنك داخل بإيميل الإدارة");}
};
</script>
</body>
</html>
