<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b22d6">
<title>سحبة | مسابقات صنّاع المحتوى</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1fb;--card:#fff;--tx:#1b1035;--mu:#6c6488;--pr:#4b22d6;--pr-hover:#3a18b0;
  --ac:#ffc934;--bd:#e3dcf5;--ok:#0f9d6b;--err:#d63b3b;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120b26;--card:#1d1438;--tx:#f4f0ff;--mu:#a99fcb;--pr:#8a6bff;--pr-hover:#9d82ff;--bd:#33274f
  }
}
:root[data-theme="dark"]{
  --bg:#120b26;--card:#1d1438;--tx:#f4f0ff;--mu:#a99fcb;--pr:#8a6bff;--pr-hover:#9d82ff;--bd:#33274f
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Readex Pro",Tahoma,sans-serif;line-height:1.6}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}

/* Top Bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-weight:700;font-size:22px;color:var(--pr);display:flex;align-items:center;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--pr)}

/* Buttons & Inputs */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:16px;background:var(--pr);color:#fff;cursor:pointer;margin-top:10px;text-align:center;transition:.2s}
.btn:hover{background:var(--pr-hover)}
.btn.alt{background:var(--ac);color:#1b1035}
.btn.red{background:var(--err);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;margin-top:6px}
input:focus,textarea:focus{outline:3px solid var(--ac);outline-offset:2px}
label{font-size:14px;color:var(--mu);display:block;margin-top:12px}

/* Search Bar */
.search-box{position:relative;margin-bottom:16px}
.search-box input{padding-right:40px}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:16px}

/* Grid & Cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 4px 20px rgba(75,34,214,0.04);display:flex;flex-direction:column;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px)}
.card-img{height:120px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-title{font-size:15px;font-weight:700;line-height:1.3}
.card-by{color:var(--mu);font-size:12px}
.badge{background:var(--ac);color:#1b1035;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;display:inline-block;width:fit-content;margin-top:4px}
.badge.done{background:var(--bd);color:var(--mu)}

/* Details View */
.details-banner{height:220px;background:var(--bd);border-radius:18px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:64px}
.details-banner img{width:100%;height:100%;object-fit:cover}
.ticket{position:relative;background:var(--ac);color:#1b1035;border-radius:18px;padding:20px;text-align:center;margin-top:14px;
-webkit-mask:radial-gradient(circle 12px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
mask:radial-gradient(circle 12px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket small{display:block;font-size:13px;opacity:.8}
.ticket b{display:block;font-size:36px;letter-spacing:3px;line-height:1.2;direction:ltr;margin-top:4px}
.win-box{background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:16px;text-align:center;margin-top:14px}
.win-box b{direction:ltr;display:inline-block;color:var(--pr)}

/* Stats & Profile */
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pr);line-height:1.2}
.stat small{color:var(--mu);font-size:11px}
.profile-header{text-align:center;padding:16px 0}
.avatar{width:76px;height:76px;background:var(--pr);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 10px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Panel */
.panel{background:var(--card);border:1.5px dashed var(--pr);border-radius:18px;padding:16px;margin-bottom:16px;display:none}

/* Bottom Navigation */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd);border-radius:24px 24px 0 0;display:flex;padding:8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px);box-shadow:0 -4px 20px rgba(0,0,0,0.05);z-index:10}
.nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px;transition:.2s}
.nav button span{font-size:20px}
.nav button.on{color:var(--pr);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:40px 0;grid-column:1/-1}
</style>
</head>
<body>

<div id="app">
  <!-- Top Bar -->
  <div class="top">
    <div class="brand">🎁 سحبة</div>
    <div id="authArea">
      <button id="loginBtn" class="chip">تسجيل الدخول</button>
    </div>
  </div>

  <!-- Main Views Container -->
  <main style="flex:1">
    
    <!-- 1. الرئيسية -->
    <div id="view_home">
      <button id="newBtn" class="btn alt" style="display:none;margin-bottom:14px">➕ أضف مسابقة جديدة</button>
      
      <div id="panel" class="panel">
        <h3 style="color:var(--pr)">إضافة مسابقة جديدة</h3>
        <label>عنوان الجائزة</label>
        <input id="a_title" placeholder="مثلًا: ايفون 16 برو">
        <label>التفاصيل والشروط</label>
        <textarea id="a_desc" rows="2" placeholder="اكتب شروط المشاركة..."></textarea>
        <label>بواسطة (اسم المنظم / صانع المحتوى)</label>
        <input id="a_by" placeholder="مثلًا: أحمد التقني">
        <label>رابط الصورة (اختياري، يبدأ بـ https)</label>
        <input id="a_img" placeholder="https://...">
        <label>موعد السحب</label>
        <input id="a_date" type="datetime-local">
        <button id="addBtn" class="btn" style="margin-top:14px">نشر المسابقة</button>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="searchInp" placeholder="ابحث عن السحوبات والجوائز..." oninput="filterRaffles(this.value)">
      </div>

      <div id="list" class="grid"></div>
    </div>

    <!-- 2. تفاصيل الجائزة المحددة -->
    <div id="view_details" style="display:none">
      <button class="chip" onclick="switchView('home')" style="margin-bottom:12px">← رجوع للرئيسية</button>
      <div id="detailsContent"></div>
    </div>

    <!-- 3. المحفظة / مشاركاتي -->
    <div id="view_wallet" style="display:none">
      <h2 style="font-size:20px;margin-bottom:12px;color:var(--pr)">مشاركاتي في السحوبات</h2>
      <div id="walletList"></div>
    </div>

    <!-- 4. الملف الشخصي (حسابي) -->
    <div id="view_profile" style="display:none">
      <div id="profileContent"></div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="nav" id="bottomNav" style="display:none">
    <button id="navHome" class="on" onclick="switchView('home')"><span>🏠</span>الرئيسية</button>
    <button id="navWallet" onclick="switchView('wallet')"><span>🎟️</span>مشاركاتي</button>
    <button id="navProfile" onclick="switchView('profile')"><span>👤</span>الملف</button>
  </nav>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore, doc, getDocs, addDoc, updateDoc, deleteDoc, writeBatch, collection, onSnapshot, query, orderBy, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyATHhHkoy7w6x8ht4NqxPysX3q8WC7DmiE",
  authDomain:"sahbaha-f7f8b.firebaseapp.com",
  projectId:"sahbaha-f7f8b",
  storageBucket:"sahbaha-f7f8b.firebasestorage.app",
  messagingSenderId:"434766319310",
  appId:"1:434766319310:web:30f2d72869325be34fca9f"
});

const auth = getAuth(app), db = getFirestore(app);
const ADMIN = "mahranasyed@gmail.com";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0];
const fmt = ms => new Date(ms).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"});

let user = null, raffles = [], joined = [], codes = {}, currentView = "home", selectedRaffleId = null, unsubJoined = null, searchKeyword = "";

window.switchView = (v) => {
  currentView = v;
  ["home", "details", "wallet", "profile"].forEach(id => {
    $("view_" + id).style.display = (id === v) ? "" : "none";
  });
  $("navHome").className = (v === "home") ? "on" : "";
  $("navWallet").className = (v === "wallet") ? "on" : "";
  $("navProfile").className = (v === "profile") ? "on" : "";
  renderAll();
};

window.openDetails = (id) => {
  selectedRaffleId = id;
  switchView('details');
};

window.filterRaffles = (kw) => {
  searchKeyword = kw.trim().toLowerCase();
  renderHome();
};

function cardHTML(r) {
  const open = r.status === "open";
  const due = Date.now() >= (r.endsAt || 0);
  const imgTag = /^https:\/\//.test(r.image || "") ? `<img src="${esc(r.image)}" alt="">` : "🎁";
  
  return `
    <div class="card" onclick="openDetails('${r.id}')">
      <div class="card-img">${imgTag}</div>
      <div class="card-body">
        <div class="card-title">${esc(r.title)}</div>
        <div class="card-by">${esc(r.by || r.ownerName)}</div>
        <span class="badge ${open && !due ? '' : 'done'}">${open && !due ? 'نشط وقائم' : 'منتهي'}</span>
      </div>
    </div>
  `;
}

function renderHome() {
  const filtered = raffles.filter(r => !searchKeyword || r.title.toLowerCase().includes(searchKeyword) || (r.by && r.by.toLowerCase().includes(searchKeyword)));
  $("list").innerHTML = filtered.length 
    ? filtered.map(cardHTML).join("") 
    : '<div class="empty">لا توجد مسابقات مطابقة للبحث حالياً 🎈</div>';
}

function renderDetails() {
  const r = raffles.find(x => x.id === selectedRaffleId);
  const box = $("detailsContent");
  if (!r) { box.innerHTML = '<div class="empty">المسابقة غير موجودة أو تم حذفها</div>'; return; }

  const open = r.status === "open";
  const due = Date.now() >= (r.endsAt || 0);
  const imgTag = /^https:\/\//.test(r.image || "") ? `<img src="${esc(r.image)}" alt="">` : "🎁";
  let act = "";

  if (!open) {
    const me = user && r.winnerUid === user.uid;
    act = `<div class="win-box">${me ? "🎉 مبروك، أنت الفائز بالجائزة!<br>" : ""}🏆 الفائز: <b>${esc(r.winnerName)}</b><br>كود الفوز: <b>${esc(r.winnerCode)}</b></div>`;
  } else if (user && r.ownerUid === user.uid) {
    act = due
      ? `<button class="btn alt" data-draw="${r.id}">🎲 اسحب الفائز الآن</button>`
      : `<p class="badge done" style="text-align:center;margin-top:12px;width:100%">هذه مسابقتك. سيظهر زر السحب عند انتهاء الموعد.</p>`;
  } else if (codes[r.id]) {
    act = `<div class="ticket"><small>رقم كود المشاركة الخاص بك</small><b>${esc(codes[r.id])}</b></div>`;
  } else if (due) {
    act = `<p class="badge done" style="text-align:center;margin-top:12px;width:100%">انتهى وقت الاشتراك، في انتظار السحب...</p>`;
  } else {
    act = `<button class="btn alt" data-join="${r.id}">✨ اشترك في السحب الآن</button>`;
  }

  const delBtn = (user && (r.ownerUid === user.uid || user.email?.toLowerCase() === ADMIN)) 
    ? `<button class="btn red" style="margin-top:12px" data-del="${r.id}">حذف المسابقة نهائياً</button>` : "";

  box.innerHTML = `
    <div class="details-banner">${imgTag}</div>
    <h2 style="font-size:22px;color:var(--pr)">${esc(r.title)}</h2>
    <div style="color:var(--mu);font-size:14px;margin-top:4px">بواسطة: ${esc(r.by || r.ownerName)}</div>
    <p style="margin-top:12px;color:var(--tx);font-size:15px">${esc(r.desc || "بدون تفاصيل إضافية")}</p>
    <div style="margin-top:12px;font-size:13px;color:var(--mu)">📅 موعد السحب: <b>${esc(fmt(r.endsAt || 0))}</b></div>
    ${act}
    ${delBtn}
  `;
}

function renderWallet() {
  const box = $("walletList");
  if (!user) { box.innerHTML = '<div class="empty">يرجى تسجيل الدخول لعرض مشاركاتك والأكواد الخاصة بك.</div>'; return; }
  
  const map = {};
  raffles.forEach(r => map[r.id] = r);
  
  const list = joined.slice().sort((a,b)=>((b.at?.toMillis?.()||0)-(a.at?.toMillis?.()||0)));
  box.innerHTML = list.map(j => {
    const r = map[j.id];
    let st = "⏳ بانتظار السحب";
    if (!r) st = "🗑️ حُذفت المسابقة";
    else if (r.status === "closed") {
      st = (r.winnerUid === user.uid) ? "🎉 فزت بالجائزة!" : "❌ لم تفز";
    }
    return `
      <div class="card" style="margin-bottom:10px;cursor:default;padding:12px">
        <div style="font-weight:700">${esc(r?.title || j.title)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px">
          <span>الكود: <b style="direction:ltr;color:var(--pr);font-size:16px">${esc(j.code)}</b></span>
          <span class="badge">${st}</span>
        </div>
      </div>
    `;
  }).join("") || '<div class="empty">لم تشترك في أي مسابقة بعد. اختر مسابقة من الرئيسية واشترك!</div>';
}

function renderProfile() {
  const box = $("profileContent");
  if (!user) { box.innerHTML = '<div class="empty">يرجى تسجيل الدخول بحساب جوجل.</div>'; return; }

  const mine = raffles.filter(r => r.ownerUid === user.uid);
  const photoUrl = user.photoURL ? `<img src="${user.photoURL}" alt="">` : "👤";

  box.innerHTML = `
    <div class="profile-header">
      <div class="avatar">${photoUrl}</div>
      <h2 style="font-size:18px">${esc(user.displayName)}</h2>
      <div style="color:var(--mu);font-size:13px">${esc(user.email)}</div>
    </div>
    <div class="stats">
      <div class="stat"><b>${joined.length}</b><small>مشاركاتي</small></div>
      <div class="stat"><b>${mine.length}</b><small>مسابقاتي</small></div>
    </div>
    <h3 style="font-size:16px;margin:16px 0 8px;color:var(--pr)">مسابقاتي التي أضفتها</h3>
    ${mine.length ? mine.map(cardHTML).join("") : '<div class="empty" style="padding:20px 0">لم تقم بإنشاء أي مسابقات بعد.</div>'}
    <button class="btn red" id="logoutBtn" style="margin-top:24px">تسجيل الخروج</button>
  `;
  
  const loBtn = $("logoutBtn");
  if(loBtn) loBtn.onclick = () => signOut(auth);
}

function renderAll() {
  renderHome();
  if (currentView === 'details') renderDetails();
  if (currentView === 'wallet') renderWallet();
  if (currentView === 'profile') renderProfile();
}

onSnapshot(query(collection(db, "raffles"), orderBy("createdAt", "desc")), s => {
  raffles = s.docs.map(d => ({id: d.id, ...d.data()}));
  renderAll();
});

onAuthStateChanged(auth, u => {
  user = u; joined = []; codes = {};
  if (unsubJoined) { unsubJoined(); unsubJoined = null; }
  
  $("loginBtn").style.display = u ? "none" : "";
  $("newBtn").style.display = u ? "" : "none";
  $("bottomNav").style.display = u ? "flex" : "none";
  if (!u) { $("panel").style.display = "none"; switchView("home"); }
  
  if (u) {
    unsubJoined = onSnapshot(collection(db, "users", u.uid, "joined"), s => {
      joined = s.docs.map(d => ({id: d.id, ...d.data()}));
      codes = {};
      joined.forEach(j => codes[j.id] = j.code);
      renderAll();
    }, () => {});
  }
  renderAll();
});

$("loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(() => alert("تعذر تسجيل الدخول"));
$("newBtn").onclick = () => {
  const p = $("panel");
  p.style.display = p.style.display === "block" ? "none" : "block";
};

async function joinRaffle(id, btn) {
  if (!user) { alert("يرجى تسجيل الدخول أولاً"); return; }
  const r = raffles.find(x => x.id === id);
  btn.disabled = true;
  for (let i = 0; i < 6; i++) {
    const code = String(100000 + rnd() % 900000);
    try {
      const batch = writeBatch(db);
      batch.set(doc(db, "raffles", id, "codes", code), {uid: user.uid});
      batch.set(doc(db, "raffles", id, "entries", user.uid), {name: user.displayName || "مشارك", email: user.email, code, at: serverTimestamp()});
      batch.set(doc(db, "users", user.uid, "joined", id), {code, title: r ? r.title : "", at: serverTimestamp()});
      await batch.commit();
      alert("تم الاشتراك بنجاح! تم توليد كود المشاركة الخاص بك 🎟️");
      return;
    } catch (err) {}
  }
  alert("تعذر الاشتراك، ربما انتهى الوقت أو أنت مشترك مسبقاً.");
  btn.disabled = false;
}

async function drawWinner(id) {
  try {
    const s = await getDocs(collection(db, "raffles", id, "entries"));
    if (!s.size) { alert("لا يوجد مشاركون في هذا السحب!"); return; }
    if (!confirm(`عدد المشاركين: ${s.size}. هل تريد سحب الفائز الآن؟`)) return;
    const d = s.docs[rnd() % s.size];
    const w = d.data();
    await updateDoc(doc(db, "raffles", id), {status: "closed", winnerUid: d.id, winnerName: w.name, winnerCode: w.code, drawnAt: serverTimestamp()});
    alert("تم السحب بنجاح وإعلان الفائز! 🎉");
  } catch (err) { alert("حدث خطأ أثناء إجراء السحب."); }
}

async function deleteRaffle(id) {
  if (!confirm("هل أنت متأكد من حذف هذه المسابقة نهائياً؟")) return;
  try { 
    await deleteDoc(doc(db, "raffles", id)); 
    switchView('home');
    alert("تم الحذف بنجاح");
  } catch (err) { alert("تعذر الحذف."); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.join) joinRaffle(b.dataset.join, b);
  else if (b.dataset.draw) drawWinner(b.dataset.draw);
  else if (b.dataset.del) deleteRaffle(b.dataset.del);
});

$("addBtn").onclick = async () => {
  if (!user) { alert("سجل دخولك أولاً"); return; }
  const title = $("a_title").value.trim();
  const end = new Date($("a_date").value).getTime();
  const img = $("a_img").value.trim();
  if (!title) { alert("يرجى كتابة عنوان الجائزة"); return; }
  if (!end || end <= Date.now()) { alert("يرجى اختيار موعد سحب صحيح في المستقبل"); return; }
  
  try {
    await addDoc(collection(db, "raffles"), {
      title,
      desc: $("a_desc").value.trim(),
      image: img,
      by: $("a_by").value.trim() || user.displayName || "",
      endsAt: end,
      ownerUid: user.uid,
      ownerName: user.displayName || "",
      status: "open",
      createdAt: serverTimestamp()
    });
    ["a_title", "a_desc", "a_by", "a_img", "a_date"].forEach(i => $(i).value = "");
    $("panel").style.display = "none";
    alert("تم نشر المسابقة بنجاح! 🚀");
  } catch (err) { alert("تعذر النشر، حاول مرة أخرى."); }
};

setInterval(renderAll, 60000);
</script>
</body>
</html>
