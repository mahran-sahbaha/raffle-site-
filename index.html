<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="سحبها: موقع سحوبات وجوائز، اشترك في السحب وخد كودك">
<meta name="theme-color" content="#6c3df4">
<title>سحبها | سحوبات وجوائز</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 140'%3E%3Crect width='140' height='140' rx='36' fill='%236c3df4'/%3E%3Crect x='30' y='70' width='80' height='52' rx='6' fill='%23fff'/%3E%3Crect x='24' y='54' width='92' height='20' rx='6' fill='%23fff'/%3E%3Crect x='66' y='54' width='8' height='68' fill='%23ffd166'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ff;--ink:#1d1b3a;--main:#6c3df4;--main2:#ff5fa2;--mute:#6b6888}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:22px 20px 52px;text-align:center}
.logo{width:72px;height:72px;display:block;margin:0 auto 8px}
header h1{margin:0 0 4px;font-size:32px}
header p{margin:0;opacity:.9}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}
.bar span{font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:var(--main);color:#fff;font-weight:600}
button.light{background:#fff;color:var(--main)}
button.gray{background:#e5e2f5;color:var(--ink)}
button.red{background:#e5484d}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:8px;max-width:900px;margin:-26px auto 14px;padding:0 14px}
.tabs button{flex:1;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(60,40,140,.12)}
.tabs button.on{background:var(--main);color:#fff}
main{max-width:900px;margin:0 auto 40px;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(60,40,140,.12);display:flex;flex-direction:column}
.pic{height:160px;background:#ece8ff;display:flex;align-items:center;justify-content:center;font-size:64px}
.pic img{width:100%;height:100%;object-fit:cover}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0}
.body p{margin:0;color:var(--mute);font-size:14px}
.by{font-size:14px;color:var(--main);font-weight:600}
.tag{font-size:13px;color:var(--mute)}
.code{background:#f0ebff;border-radius:10px;padding:10px;text-align:center}
.code b{display:block;font-size:26px;letter-spacing:4px;color:var(--main);direction:ltr}
.win{background:#fff6d6;border-radius:10px;padding:10px;text-align:center}
.win b{direction:ltr;display:inline-block}
.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(60,40,140,.12);display:none}
.panel h3{margin-top:0}
.panel label{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.panel input,.panel textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #d6d1ee;border-radius:8px;font:inherit}
.empty{text-align:center;color:var(--mute);padding:40px 0;grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;box-shadow:0 4px 14px rgba(60,40,140,.12);font-size:13px;color:var(--mute)}
.stat b{display:block;font-size:24px;color:var(--main)}
h2.sec{font-size:18px;margin:20px 0 10px}
.rowcard{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(60,40,140,.12)}
.rowcard .side{text-align:left;font-size:14px}
.mini{color:var(--mute);font-size:12px}
.mini b{display:block;font-size:18px;color:var(--main);letter-spacing:2px;direction:ltr}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 0 30px}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 140 140" role="img" aria-label="شعار سحبها">
    <rect width="140" height="140" rx="36" fill="#fff"/>
    <rect x="30" y="70" width="80" height="52" rx="6" fill="#6c3df4"/>
    <rect x="24" y="54" width="92" height="20" rx="6" fill="#6c3df4"/>
    <rect x="66" y="54" width="8" height="68" fill="#ff5fa2"/>
    <path d="M70 54c-14-2-26-9-21-18s17-5 21 18z" fill="#ff5fa2"/>
    <path d="M70 54c14-2 26-9 21-18s-17-5-21 18z" fill="#ff5fa2"/>
    <path d="M122 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd166"/>
  </svg>
  <h1>سحبها</h1>
  <p>سحوبات حقيقية، وحظك عليك</p>
  <div class="bar">
    <button id="login" class="light">الدخول بجوجل</button>
    <span id="who"></span>
    <button id="out" class="light" style="display:none">خروج</button>
  </div>
</header>
<div class="tabs">
  <button id="t_home" class="on">الرئيسية</button>
  <button id="t_acc">حسابي</button>
</div>
<main>
  <div id="homeView">
    <button id="newbtn" style="display:none;margin-bottom:12px">➕ أضف جايزتك</button>
    <div id="panel" class="panel">
      <h3>إضافة جايزة جديدة</h3>
      <label>اسم الجايزة</label>
      <input id="a_title" placeholder="مثلًا: ايفون 15">
      <label>وصف الجايزة</label>
      <textarea id="a_desc" rows="2" placeholder="تفاصيل الجايزة وشروط المشاركة"></textarea>
      <label>بواسطة (اسم القناة أو المدرس)</label>
      <input id="a_by" placeholder="مثلًا: قناة أحمد أو أ. سارة">
      <label>رابط صورة (اختياري، يبدأ بـ https)</label>
      <input id="a_img" placeholder="https://...">
      <label>موعد السحب</label>
      <input id="a_date" type="datetime-local">
      <button id="add">نشر الجايزة</button>
    </div>
    <div id="list" class="grid"></div>
  </div>
  <div id="accView" style="display:none"></div>
</main>
<footer>سحبها © 2026</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDocs,addDoc,updateDoc,deleteDoc,writeBatch,collection,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyATHhHkoy7w6x8ht4NqxPysX3q8WC7DmiE",
  authDomain:"sahbaha-f7f8b.firebaseapp.com",
  projectId:"sahbaha-f7f8b",
  storageBucket:"sahbaha-f7f8b.firebasestorage.app",
  messagingSenderId:"434766319310",
  appId:"1:434766319310:web:30f2d72869325be34fca9f"
});
const auth=getAuth(app), db=getFirestore(app);
const ADMIN="mahranasyed@gmail.com";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=()=>crypto.getRandomValues(new Uint32Array(1))[0];
const fmt=ms=>new Date(ms).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"});

let user=null, raffles=[], joined=[], codes={}, tab="home", unsubJoined=null;
const isAdmin=()=>!!(user&&user.email&&user.email.toLowerCase()===ADMIN);
const isOwner=r=>!!(user&&r.ownerUid===user.uid);

function cardHTML(r){
  const open=r.status==="open";
  const due=Date.now()>=(r.endsAt||0);
  const img=/^https:\/\//.test(r.image||"")?'<img src="'+esc(r.image)+'" alt="">':"🎁";
  let act="";
  if(!open){
    const me=user&&r.winnerUid===user.uid;
    act='<div class="win">'+(me?"🎉 مبروك، أنت الفائز!<br>":"")+'🏆 الفائز: <b>'+esc(r.winnerName)+'</b><br>كوده: <b>'+esc(r.winnerCode)+'</b></div>';
  }else if(isOwner(r)){
    act=due
      ?'<button data-draw="'+r.id+'">🎲 اسحب الفائز</button>'
      :'<div class="tag">دي جايزتك. زرار السحب هيظهر بعد الموعد.</div>';
  }else if(codes[r.id]){
    act='<div class="code">✅ أنت مشترك، كودك<b>'+esc(codes[r.id])+'</b></div>';
  }else if(due){
    act='<div class="tag">انتهى وقت الاشتراك، في انتظار السحب.</div>';
  }else{
    act='<button data-join="'+r.id+'">اشترك في السحب</button>';
  }
  const del=(isOwner(r)||isAdmin())?'<button class="red" data-del="'+r.id+'">حذف</button>':"";
  return '<div class="card"><div class="pic">'+img+'</div><div class="body"><h3>'+esc(r.title)+'</h3><div class="by">بواسطة: '+esc(r.by||r.ownerName)+'</div><p>'+esc(r.desc)+'</p><div class="tag">📅 موعد السحب: '+esc(fmt(r.endsAt||0))+'</div>'+act+del+'</div></div>';
}

function renderHome(){
  const box=$("list");
  box.innerHTML=raffles.length
    ?raffles.map(cardHTML).join("")
    :'<div class="empty">لا توجد جوائز حاليًا، كن أول من يضيف جايزة 🎈</div>';
}

function renderAccount(){
  const v=$("accView");
  if(!user){v.innerHTML='<div class="empty">سجّل دخولك بجوجل لتشوف حسابك</div>';return;}
  const map={};
  raffles.forEach(r=>map[r.id]=r);
  let won=0,lost=0,wait=0;
  const list=joined.slice().sort((a,b)=>((b.at&&b.at.toMillis?b.at.toMillis():0)-(a.at&&a.at.toMillis?a.at.toMillis():0)));
  const rows=list.map(j=>{
    const r=map[j.id];
    let st;
    if(!r){st="🗑️ الجايزة اتحذفت";}
    else if(r.status==="open"){st="⏳ بانتظار السحب<br>"+esc(fmt(r.endsAt));wait++;}
    else if(r.winnerUid===user.uid){st="🏆 فزت!";won++;}
    else{st="❌ لم تفز";lost++;}
    const title=(r&&r.title)||j.title||"";
    return '<div class="rowcard"><div><b>'+esc(title)+'</b><div class="tag">بواسطة: '+esc(r?(r.by||r.ownerName):"")+'</div></div><div class="side"><div class="mini">كودك<b>'+esc(j.code)+'</b></div><div>'+st+'</div></div></div>';
  }).join("")||'<div class="empty">لم تشترك في أي سحب بعد</div>';
  const mine=raffles.filter(isOwner);
  v.innerHTML=
    '<div class="stats"><div class="stat"><b>'+list.length+'</b>اشتركت</div><div class="stat"><b>'+won+'</b>فزت</div><div class="stat"><b>'+lost+'</b>لم تفز</div><div class="stat"><b>'+wait+'</b>بانتظار</div></div>'+
    '<h2 class="sec">سحوباتي</h2>'+rows+
    '<h2 class="sec">جوائزي التي أضفتها</h2>'+
    (mine.length?'<div class="grid">'+mine.map(cardHTML).join("")+'</div>':'<div class="empty">لم تضف جوائز بعد</div>');
}

function renderAll(){
  $("t_home").className=tab==="home"?"on":"";
  $("t_acc").className=tab==="acc"?"on":"";
  $("homeView").style.display=tab==="home"?"":"none";
  $("accView").style.display=tab==="acc"?"":"none";
  renderHome();
  renderAccount();
}

$("t_home").onclick=()=>{tab="home";renderAll();};
$("t_acc").onclick=()=>{tab="acc";renderAll();};

onSnapshot(query(collection(db,"raffles"),orderBy("createdAt","desc")),s=>{
  raffles=s.docs.map(d=>({id:d.id,...d.data()}));
  renderAll();
});

onAuthStateChanged(auth,u=>{
  user=u; joined=[]; codes={};
  if(unsubJoined){unsubJoined();unsubJoined=null;}
  $("login").style.display=u?"none":"";
  $("out").style.display=u?"":"none";
  $("newbtn").style.display=u?"":"none";
  if(!u)$("panel").style.display="none";
  $("who").textContent=u?("أهلًا "+(u.displayName||"")):"";
  if(u){
    unsubJoined=onSnapshot(collection(db,"users",u.uid,"joined"),s=>{
      joined=s.docs.map(d=>({id:d.id,...d.data()}));
      codes={};
      joined.forEach(j=>codes[j.id]=j.code);
      renderAll();
    },()=>{});
  }
  renderAll();
});

$("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>alert("تعذر تسجيل الدخول"));
$("out").onclick=()=>signOut(auth);
$("newbtn").onclick=()=>{
  const p=$("panel");
  p.style.display=p.style.display==="block"?"none":"block";
};

async function join(id,b){
  if(!user){alert("سجّل دخولك بجوجل الأول");return;}
  const r=raffles.find(x=>x.id===id);
  b.disabled=true;
  for(let i=0;i<6;i++){
    const code=String(100000+rnd()%900000);
    try{
      const batch=writeBatch(db);
      batch.set(doc(db,"raffles",id,"codes",code),{uid:user.uid});
      batch.set(doc(db,"raffles",id,"entries",user.uid),{name:user.displayName||"مشترك",email:user.email,code,at:serverTimestamp()});
      batch.set(doc(db,"users",user.uid,"joined",id),{code,title:r?r.title:"",at:serverTimestamp()});
      await batch.commit();
      return;
    }catch(err){}
  }
  alert("تعذر الاشتراك، يمكن الموعد انتهى أو أنت مشترك بالفعل");
  b.disabled=false;
}

async function draw(id){
  try{
    const s=await getDocs(collection(db,"raffles",id,"entries"));
    if(!s.size){alert("لا يوجد مشتركين في هذا السحب");return;}
    if(!confirm("عدد المشتركين: "+s.size+". تأكيد السحب؟"))return;
    const d=s.docs[rnd()%s.size];
    const w=d.data();
    await updateDoc(doc(db,"raffles",id),{status:"closed",winnerUid:d.id,winnerName:w.name,winnerCode:w.code,drawnAt:serverTimestamp()});
  }catch(err){alert("حصل خطأ في السحب");}
}

async function del(id){
  if(!confirm("حذف الجايزة نهائيًا؟"))return;
  try{await deleteDoc(doc(db,"raffles",id));}catch(err){alert("تعذر الحذف");}
}

function clicks(e){
  const b=e.target.closest("button");
  if(!b)return;
  if(b.dataset.join)join(b.dataset.join,b);
  else if(b.dataset.draw)draw(b.dataset.draw);
  else if(b.dataset.del)del(b.dataset.del);
}
$("list").onclick=clicks;
$("accView").onclick=clicks;

$("add").onclick=async()=>{
  if(!user){alert("سجّل دخولك الأول");return;}
  const title=$("a_title").value.trim();
  const end=new Date($("a_date").value).getTime();
  const img=$("a_img").value.trim();
  if(!title){alert("اكتب اسم الجايزة");return;}
  if(!end||end<=Date.now()){alert("اختار موعد سحب في المستقبل");return;}
  if(img&&!/^https:\/\//.test(img)){alert("رابط الصورة لازم يبدأ بـ https");return;}
  try{
    await addDoc(collection(db,"raffles"),{
      title,
      desc:$("a_desc").value.trim(),
      image:img,
      by:$("a_by").value.trim()||user.displayName||"",
      endsAt:end,
      ownerUid:user.uid,
      ownerName:user.displayName||"",
      status:"open",
      createdAt:serverTimestamp()
    });
    ["a_title","a_desc","a_by","a_img","a_date"].forEach(i=>$(i).value="");
    $("panel").style.display="none";
  }catch(err){alert("تعذر النشر، جرّب تاني");}
};

setInterval(renderAll,60000);
</script>
</body>
</html>
